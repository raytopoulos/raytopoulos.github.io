<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="bubbleOrganizerTitle bubbleOrganizerDesc">
  <title id="bubbleOrganizerTitle">Bubble Organizer</title>
  <desc id="bubbleOrganizerDesc">Material-style tiles with bubble indicators.</desc>
  <defs>
    <linearGradient id="cardGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- App icon circle -->
  <g fill="none" stroke="none">
    <circle cx="32" cy="32" r="22" fill="#f8fafc"/>
    <circle cx="32" cy="32" r="22" fill="url(#cardGradient)" opacity="0.12"/>
  </g>
  <!-- Stacked cards -->
  <g stroke="#e2e8f0" stroke-width="1.6" stroke-linejoin="round">
    <rect x="18" y="20" width="22" height="16" rx="5" fill="#e0f2fe"/>
    <rect x="24" y="26" width="22" height="16" rx="5" fill="#f8fafc"/>
  </g>
  <!-- Bubble indicators -->
  <g>
    <circle cx="30" cy="30" r="2.1" fill="#22d3ee"/>
    <circle cx="36" cy="30" r="2.1" fill="#38bdf8"/>
    <circle cx="42" cy="30" r="2.1" fill="#0f172a"/>
  </g>
  <!-- Bottom bar hinting timeline/list -->
  <rect x="28" y="36" width="14" height="2.4" rx="1.2" fill="#38bdf8" opacity="0.9"/>
</svg>
