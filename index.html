<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bubble Organizer – Instances</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="merged.css" />
  <style>
    .landing-shell {
      max-width: 960px;
      margin: 40px auto;
      padding: 24px;
    }
    .landing-card {
      background: var(--panel, #ffffff);
      border-radius: 20px;
      padding: 24px 24px 28px;
      box-shadow: 0 25px 80px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(15, 23, 42, 0.05);
    }
    .landing-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .landing-title {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      margin: 0;
    }
    .landing-subtitle {
      margin: 4px 0 0;
      color: var(--muted, #64748b);
      max-width: 60ch;
      font-size: 0.95rem;
    }
    .landing-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }
    .landing-input {
      flex: 1 1 220px;
      min-width: 0;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border, #e2e8f0);
      font-family: inherit;
      font-size: 0.95rem;
    }
    .landing-button {
      padding: 9px 14px;
      border-radius: 999px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent, #22d3ee);
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(34, 211, 238, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .landing-button.secondary {
      background: var(--panel-2, #f8fafc);
      color: var(--text, #0f172a);
      box-shadow: none;
      border: 1px solid var(--border, #e2e8f0);
    }
    .landing-status {
      margin-bottom: 16px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.04);
      color: var(--muted, #64748b);
      font-size: 0.9rem;
    }
    .landing-status--error {
      background: #fee2e2;
      color: #b91c1c;
    }
    .instance-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-top: 4px;
    }
    .instance-card {
      border-radius: 16px;
      border: 1px solid var(--border, #e2e8f0);
      background: #ffffff;
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: box-shadow 150ms ease, transform 150ms ease, border-color 150ms ease;
    }
    .instance-card:hover {
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      transform: translateY(-1px);
      border-color: var(--accent, #22d3ee);
    }
    .instance-id {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .instance-meta {
      font-size: 0.82rem;
      color: var(--muted, #64748b);
    }
    .empty-state {
      margin-top: 6px;
      font-size: 0.9rem;
      color: var(--muted, #64748b);
    }
    @media (max-width: 640px) {
      .landing-shell {
        margin: 16px auto 32px;
        padding: 16px;
      }
      .landing-card {
        padding: 18px 16px 22px;
        border-radius: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="landing-shell">
    <section class="landing-card" aria-live="polite">
      <header class="landing-header">
        <div>
          <h1 class="landing-title">Bubble Organizer</h1>
          <p class="landing-subtitle">
            Jump into an existing planner by id, or create a new prototype and its first instance.
          </p>
        </div>
      </header>

      <div class="landing-actions">
        <input
          id="idInput"
          class="landing-input"
          type="text"
          placeholder="Paste an instance or prototype id…"
          aria-label="Instance or prototype id" />
        <button id="goBtn" class="landing-button" type="button">
          Open
        </button>
        <button id="createBtn" class="landing-button secondary" type="button">
          + New planner
        </button>
      </div>

      <div id="status" class="landing-status">Waiting for an id. Provide a composite or prototype id, or create a new planner.</div>
      <div id="instancesContainer"></div>
    </section>
  </div>

  <script type="module">
    import { i18n } from './i18n.js';
    import {
      PROTOTYPE_ID_LENGTH,
      createPrototypeSet,
      loadPrototypeSet,
      createInstance
    } from './instances.js';

    const appRootPath = new URL('.', window.location.href).pathname.replace(/\/+$/, '/') || '/';
    const LS_PROTOTYPE_KEY = 'organizer:prototypeId';
    const errorStatusKeys = new Set([
      'landingStatusRecreateError',
      'landingStatusNoPrototype',
      'landingStatusLoadError',
      'landingStatusCreateFail',
    ]);

    const landingTitleEl = document.querySelector('.landing-title');
    const landingSubtitleEl = document.querySelector('.landing-subtitle');

    const idInput = document.getElementById('idInput');
    const goBtn = document.getElementById('goBtn');
    const createBtn = document.getElementById('createBtn');
    const statusEl = document.getElementById('status');
    const instancesContainer = document.getElementById('instancesContainer');
    let lastStatusKey = 'landingStatusWaiting';

    function getDefaultPrototypeSeed() {
      return [
        { text: i18n.t('defaultPrototypeTask'), color: '38bdf8', description: '' },
        { text: i18n.t('defaultPrototypeIdea'), color: 'a78bfa', description: '' },
        { text: i18n.t('defaultPrototypeBug'), color: 'f87171', description: '' },
        { text: i18n.t('defaultPrototypeNote'), color: '10b981', description: '' },
      ];
    }

    function getStoredPrototypeId() {
      try {
        const value = window.localStorage.getItem(LS_PROTOTYPE_KEY);
        return value && typeof value === 'string' ? value : null;
      } catch {
        return null;
      }
    }

    function setStoredPrototypeId(id) {
      const v = String(id || '').trim();
      if (!v) return;
      try {
        window.localStorage.setItem(LS_PROTOTYPE_KEY, v);
      } catch {
        // Ignore storage errors
      }
    }

    function setStatus(message, { isError = false } = {}) {
      if (!statusEl) return;
      statusEl.textContent = message;
      if (statusEl.classList) {
        if (isError) {
          statusEl.classList.add('landing-status--error');
        } else {
          statusEl.classList.remove('landing-status--error');
        }
      }
    }

    function setStatusKey(key, options = {}) {
      lastStatusKey = key;
      const isError = options.isError || errorStatusKeys.has(key);
      setStatus(i18n.t(key), { isError });
    }

    function applyLandingCopy() {
      document.title = i18n.t('pageTitleLanding');
      if (landingTitleEl) landingTitleEl.textContent = i18n.t('landingTitle');
      if (landingSubtitleEl) landingSubtitleEl.textContent = i18n.t('landingSubtitle');
      if (idInput) {
        idInput.placeholder = i18n.t('landingInputPlaceholder');
        idInput.setAttribute('aria-label', i18n.t('landingInputLabel'));
      }
      if (goBtn) goBtn.textContent = i18n.t('landingOpen');
      if (createBtn) createBtn.textContent = i18n.t('landingNew');
      const emptyState = instancesContainer?.querySelector('.empty-state');
      if (emptyState) emptyState.textContent = i18n.t('instanceEmpty');
      if (statusEl && lastStatusKey) {
        setStatusKey(lastStatusKey);
      }
    }
    i18n.onChange(() => {
      applyLandingCopy();
    });
    applyLandingCopy();

    function clearInstances() {
      if (instancesContainer) {
        instancesContainer.innerHTML = '';
      }
    }

    function updateUrlId(id) {
      try {
        const u = new URL(window.location.href);
        if (id) {
          u.searchParams.set('id', id);
        } else {
          u.searchParams.delete('id');
        }
        window.history.replaceState({}, '', u.toString());
      } catch {
        // Ignore URL update failures
      }
    }

    function extractIdFromInput(raw) {
      const value = String(raw || '').trim();
      if (!value) return '';

      // If user pasted a full URL, try to read ?id= from it
      try {
        const maybeUrl = new URL(value, window.location.origin);
        const fromQuery = maybeUrl.searchParams.get('id');
        if (fromQuery) return fromQuery.trim();
      } catch {
        // Not a full URL, fall through to treat it as a bare id
      }

      return value;
    }

    function parseCompositeId(id) {
      if (!id) return { prototypeId: null, instanceNumber: null };
      const raw = String(id);
      if (!Number.isFinite(PROTOTYPE_ID_LENGTH) || PROTOTYPE_ID_LENGTH <= 0) {
        return { prototypeId: null, instanceNumber: null };
      }
      if (raw.length <= PROTOTYPE_ID_LENGTH) {
        return { prototypeId: null, instanceNumber: null };
      }
      const prototypeId = raw.slice(0, PROTOTYPE_ID_LENGTH);
      const suffix = raw.slice(PROTOTYPE_ID_LENGTH);
      const n = Number.parseInt(suffix, 10);
      if (!Number.isFinite(n) || n < 0) {
        return { prototypeId: null, instanceNumber: null };
      }
      return { prototypeId, instanceNumber: n };
    }

    function formatInstanceLabel(n) {
      return i18n.t('instanceLabelTemplate', { n });
    }

    function getInstanceEntries(protoDoc) {
      if (!protoDoc || typeof protoDoc !== 'object') return [];
      const map = protoDoc.instances && typeof protoDoc.instances === 'object'
        ? protoDoc.instances
        : {};
      const out = [];
      for (const key of Object.keys(map)) {
        const n = Number.parseInt(key, 10);
        if (!Number.isFinite(n) || n < 0) continue;
      const rawLabel = map[key];
      const label = (typeof rawLabel === 'string' && rawLabel.trim())
        ? rawLabel.trim()
          : formatInstanceLabel(n);
        out.push({ number: n, label });
      }
      out.sort((a, b) => a.number - b.number);
      return out;
    }

    function getInstanceNumbers(protoDoc) {
      return getInstanceEntries(protoDoc).map((entry) => entry.number);
    }

    function nextFreeInstanceNumber(numbers) {
      let candidate = 0;
      for (const n of numbers) {
        if (n === candidate) {
          candidate += 1;
        } else if (n > candidate) {
          break;
        }
      }
      return candidate;
    }

    function renderInstanceList(prototypeId, entries) {
      clearInstances();
      if (!instancesContainer) return;

      if (!entries.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = i18n.t('instanceEmpty');
        instancesContainer.appendChild(empty);
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'instance-grid';

      entries.forEach(({ number: n, label }) => {
        const compositeId = `${prototypeId}${n}`;
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'instance-card';
        card.addEventListener('click', () => {
          window.location.href = `${appRootPath}edit/?id=${encodeURIComponent(compositeId)}`;
        });

        const title = document.createElement('div');
        title.className = 'instance-id';
        title.textContent = label;

        const meta = document.createElement('div');
        meta.className = 'instance-meta';
        meta.textContent = compositeId;

        card.appendChild(title);
        card.appendChild(meta);
        grid.appendChild(card);
      });

      instancesContainer.appendChild(grid);
    }

    async function ensurePrototypeId() {
      let prototypeId = getStoredPrototypeId();
      if (prototypeId) return prototypeId;

      try {
        const created = await createPrototypeSet(getDefaultPrototypeSeed());
        prototypeId = created && created.id ? created.id : null;
        if (prototypeId) {
          setStoredPrototypeId(prototypeId);
        }
        return prototypeId;
      } catch (e) {
        console.warn('Failed to create prototype set', e);
        return null;
      }
    }

    async function ensureInstanceForPrototype(prototypeId) {
      const doc = await loadPrototypeSet(prototypeId);
      const numbers = getInstanceNumbers(doc);
      const next = nextFreeInstanceNumber(numbers);
      const compositeId = `${prototypeId}${next}`;
      const nKey = String(next);
      let label = '';
      if (doc && doc.instances && typeof doc.instances === 'object') {
        const raw = doc.instances[nKey];
        if (typeof raw === 'string' && raw.trim()) {
          label = raw.trim();
        }
      }
      if (!label) {
        label = formatInstanceLabel(nKey);
      }
      await createInstance({ id: compositeId, prototypeId, instanceNumber: next, instanceLabel: label });
      return { compositeId, instanceNumber: next };
    }

    async function handleId(rawId) {
      const id = String(rawId || '').trim();
      if (!id) {
        setStatusKey('landingStatusWaiting');
        clearInstances();
        return;
      }

      const parsed = parseCompositeId(id);
      if (parsed.prototypeId && parsed.instanceNumber !== null && parsed.instanceNumber >= 0) {
        setStoredPrototypeId(parsed.prototypeId);
        window.location.href = `${appRootPath}edit/?id=${encodeURIComponent(id)}`;
        return;
      }

      setStatusKey('landingStatusLooking');
      clearInstances();

      try {
        const protoDoc = await loadPrototypeSet(id);
        if (!protoDoc) {
          const stored = getStoredPrototypeId();
          if (stored && stored === id) {
            // Stored prototype id is invalid/missing; silently create a new one
            // and switch over without showing an error.
            try {
              const created = await createPrototypeSet(getDefaultPrototypeSeed());
              const newId = created && created.id ? created.id : null;
              if (newId) {
                setStoredPrototypeId(newId);
                updateUrlId(newId);
                await handleId(newId);
                return;
              }
            } catch (e2) {
              console.warn('Failed to recreate missing stored prototype id', e2);
            }
            setStatusKey('landingStatusRecreateError');
          } else {
            // User supplied an id that is not in local storage: show an explicit error.
            setStatusKey('landingStatusNoPrototype');
          }
          return;
        }

        // Only now that we know the prototype id is valid,
        // reflect it in the URL.
        updateUrlId(id);
        setStoredPrototypeId(id);

        const entries = getInstanceEntries(protoDoc);
        if (!entries.length) {
          setStatusKey('landingStatusProtoEmpty');
        } else {
          setStatusKey('landingStatusProtoFound');
        }
        renderInstanceList(id, entries);
      } catch (e) {
        console.warn('Failed to load prototype', e);
        setStatusKey('landingStatusLoadError');
      }
    }

    async function handleCreateNew() {
      setStatusKey('landingStatusCreate');
      clearInstances();

      const seedList = getDefaultPrototypeSeed();

      try {
        const created = await createPrototypeSet(seedList);
        const prototypeId = created.id;
        const { compositeId } = await ensureInstanceForPrototype(prototypeId);
        window.location.href = `${appRootPath}edit/?id=${encodeURIComponent(compositeId)}`;
      } catch (e) {
        console.warn('Failed to create new instance', e);
        setStatusKey('landingStatusCreateFail');
      }
    }

    async function handleCreateNewWithStorage() {
      setStatusKey('landingStatusCreate');
      clearInstances();

      try {
        let prototypeId = getStoredPrototypeId();
        if (!prototypeId) {
          prototypeId = await ensurePrototypeId();
        }
        if (!prototypeId) {
          setStatusKey('landingStatusCreateFail');
          return;
        }
        const { compositeId } = await ensureInstanceForPrototype(prototypeId);
        window.location.href = `${appRootPath}edit/?id=${encodeURIComponent(compositeId)}`;
      } catch (e) {
        console.warn('Failed to create new instance', e);
        setStatusKey('landingStatusCreateFail');
      }
    }

    goBtn?.addEventListener('click', () => {
      const extracted = extractIdFromInput(idInput?.value || '');
      if (extracted) {
        handleId(extracted);
      }
    });

    idInput?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const extracted = extractIdFromInput(idInput.value || '');
        if (extracted) {
          handleId(extracted);
        }
      }
    });

    createBtn?.addEventListener('click', () => {
      handleCreateNewWithStorage();
    });

    const url = new URL(window.location.href);
    const initialId = url.searchParams.get('id') || '';

    if (initialId) {
      handleId(initialId);
    } else {
      (async () => {
        const fromStorage = getStoredPrototypeId();
        if (fromStorage) {
          try {
            const protoDoc = await loadPrototypeSet(fromStorage);
            if (protoDoc) {
              await handleId(fromStorage);
              return;
            }

            // Stored prototype id is invalid/missing; create a new one and store it.
            const created = await createPrototypeSet(getDefaultPrototypeSeed());
            const newId = created && created.id ? created.id : null;
            if (newId) {
              setStoredPrototypeId(newId);
              await handleId(newId);
              return;
            }

            setStatusKey('landingStatusWaiting');
          } catch (e) {
            console.warn('Failed to resolve stored prototype id', e);
            setStatusKey('landingStatusWaiting');
          }
        } else {
          setStatusKey('landingStatusWaiting');
        }
      })();
    }
  </script>
</body>
</html>
