<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bubble Organizer – Instances</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/merged.css" />
  <style>
    .landing-shell {
      max-width: 960px;
      margin: 40px auto;
      padding: 24px;
    }
    .landing-card {
      background: var(--panel, #ffffff);
      border-radius: 20px;
      padding: 24px 24px 28px;
      box-shadow: 0 25px 80px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(15, 23, 42, 0.05);
    }
    .landing-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .landing-title {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      margin: 0;
    }
    .landing-subtitle {
      margin: 4px 0 0;
      color: var(--muted, #64748b);
      max-width: 60ch;
      font-size: 0.95rem;
    }
    .landing-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }
    .landing-input {
      flex: 1 1 220px;
      min-width: 0;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border, #e2e8f0);
      font-family: inherit;
      font-size: 0.95rem;
    }
    .landing-button {
      padding: 9px 14px;
      border-radius: 999px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent, #22d3ee);
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(34, 211, 238, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .landing-button.secondary {
      background: var(--panel-2, #f8fafc);
      color: var(--text, #0f172a);
      box-shadow: none;
      border: 1px solid var(--border, #e2e8f0);
    }
    .landing-status {
      margin-bottom: 16px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.04);
      color: var(--muted, #64748b);
      font-size: 0.9rem;
    }
    .instance-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-top: 4px;
    }
    .instance-card {
      border-radius: 16px;
      border: 1px solid var(--border, #e2e8f0);
      background: #ffffff;
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: box-shadow 150ms ease, transform 150ms ease, border-color 150ms ease;
    }
    .instance-card:hover {
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      transform: translateY(-1px);
      border-color: var(--accent, #22d3ee);
    }
    .instance-id {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .instance-meta {
      font-size: 0.82rem;
      color: var(--muted, #64748b);
    }
    .empty-state {
      margin-top: 6px;
      font-size: 0.9rem;
      color: var(--muted, #64748b);
    }
    @media (max-width: 640px) {
      .landing-shell {
        margin: 16px auto 32px;
        padding: 16px;
      }
      .landing-card {
        padding: 18px 16px 22px;
        border-radius: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="landing-shell">
    <section class="landing-card" aria-live="polite">
      <header class="landing-header">
        <div>
          <h1 class="landing-title">Bubble Organizer</h1>
          <p class="landing-subtitle">
            Jump into an existing planner by id, or create a new prototype and its first instance.
          </p>
        </div>
      </header>

      <div class="landing-actions">
        <input
          id="idInput"
          class="landing-input"
          type="text"
          placeholder="Paste an instance or prototype id…"
          aria-label="Instance or prototype id" />
        <button id="goBtn" class="landing-button" type="button">
          Open
        </button>
        <button id="createBtn" class="landing-button secondary" type="button">
          + New planner
        </button>
      </div>

      <div id="status" class="landing-status">Waiting for an id. Provide a composite or prototype id, or create a new planner.</div>
      <div id="instancesContainer"></div>
    </section>
  </div>

  <script type="module">
    import {
      PROTOTYPE_ID_LENGTH,
      createPrototypeSet,
      loadPrototypeSet,
      createInstance
    } from '/instances.js';

    const idInput = document.getElementById('idInput');
    const goBtn = document.getElementById('goBtn');
    const createBtn = document.getElementById('createBtn');
    const statusEl = document.getElementById('status');
    const instancesContainer = document.getElementById('instancesContainer');

    function setStatus(message) {
      if (!statusEl) return;
      statusEl.textContent = message;
    }

    function clearInstances() {
      if (instancesContainer) {
        instancesContainer.innerHTML = '';
      }
    }

    function parseCompositeId(id) {
      if (!id) return { prototypeId: null, instanceNumber: null };
      const raw = String(id);
      if (!Number.isFinite(PROTOTYPE_ID_LENGTH) || PROTOTYPE_ID_LENGTH <= 0) {
        return { prototypeId: null, instanceNumber: null };
      }
      if (raw.length <= PROTOTYPE_ID_LENGTH) {
        return { prototypeId: null, instanceNumber: null };
      }
      const prototypeId = raw.slice(0, PROTOTYPE_ID_LENGTH);
      const suffix = raw.slice(PROTOTYPE_ID_LENGTH);
      const n = Number.parseInt(suffix, 10);
      if (!Number.isFinite(n) || n < 0) {
        return { prototypeId: null, instanceNumber: null };
      }
      return { prototypeId, instanceNumber: n };
    }

    function getInstanceNumbers(protoDoc) {
      if (!protoDoc || typeof protoDoc !== 'object') return [];
      const map = protoDoc.instances && typeof protoDoc.instances === 'object'
        ? protoDoc.instances
        : {};
      const out = [];
      for (const key of Object.keys(map)) {
        const n = Number.parseInt(key, 10);
        if (Number.isFinite(n) && n >= 0) out.push(n);
      }
      out.sort((a, b) => a - b);
      return out;
    }

    function nextFreeInstanceNumber(numbers) {
      let candidate = 0;
      for (const n of numbers) {
        if (n === candidate) {
          candidate += 1;
        } else if (n > candidate) {
          break;
        }
      }
      return candidate;
    }

    function renderInstanceList(prototypeId, numbers) {
      clearInstances();
      if (!instancesContainer) return;

      if (!numbers.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No instances found for this prototype yet.';
        instancesContainer.appendChild(empty);
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'instance-grid';

      numbers.forEach((n) => {
        const compositeId = `${prototypeId}${n}`;
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'instance-card';
        card.addEventListener('click', () => {
          window.location.href = `/edit/?id=${encodeURIComponent(compositeId)}`;
        });

        const title = document.createElement('div');
        title.className = 'instance-id';
        title.textContent = `Instance #${n}`;

        const meta = document.createElement('div');
        meta.className = 'instance-meta';
        meta.textContent = compositeId;

        card.appendChild(title);
        card.appendChild(meta);
        grid.appendChild(card);
      });

      instancesContainer.appendChild(grid);
    }

    async function ensureInstanceForPrototype(prototypeId) {
      const doc = await loadPrototypeSet(prototypeId);
      const numbers = getInstanceNumbers(doc);
      const next = nextFreeInstanceNumber(numbers);
      const compositeId = `${prototypeId}${next}`;
      await createInstance({ id: compositeId, prototypeId, instanceNumber: next });
      return { compositeId, instanceNumber: next };
    }

    async function handleId(rawId) {
      const id = String(rawId || '').trim();
      if (!id) {
        setStatus('Waiting for an id. Provide a composite or prototype id, or create a new planner.');
        clearInstances();
        return;
      }

      const parsed = parseCompositeId(id);
      if (parsed.prototypeId && parsed.instanceNumber !== null && parsed.instanceNumber >= 0) {
        window.location.href = `/edit/?id=${encodeURIComponent(id)}`;
        return;
      }

      setStatus('Looking up prototype…');
      clearInstances();

      try {
        const protoDoc = await loadPrototypeSet(id);
        if (!protoDoc) {
          setStatus('No prototype found with this id.');
          return;
        }

        const nums = getInstanceNumbers(protoDoc);
        if (!nums.length) {
          setStatus('Prototype found, but there are no instances yet. Create a new one below.');
        } else {
          setStatus('Prototype found. Choose an instance to open, or create another.');
        }
        renderInstanceList(id, nums);
      } catch (e) {
        console.warn('Failed to load prototype', e);
        setStatus('Something went wrong while loading this prototype.');
      }
    }

    async function handleCreateNew() {
      setStatus('Creating a new prototype and its first instance…');
      clearInstances();

      const seedList = [
        { text: 'Task', color: '38bdf8', description: '' },
        { text: 'Idea', color: 'a78bfa', description: '' },
        { text: 'Bug', color: 'f87171', description: '' },
        { text: 'Note', color: '10b981', description: '' },
      ];

      try {
        const created = await createPrototypeSet(seedList);
        const prototypeId = created.id;
        const { compositeId } = await ensureInstanceForPrototype(prototypeId);
        window.location.href = `/edit/?id=${encodeURIComponent(compositeId)}`;
      } catch (e) {
        console.warn('Failed to create new instance', e);
        setStatus('Could not create a new planner right now. Please try again.');
      }
    }

    goBtn?.addEventListener('click', () => {
      handleId(idInput?.value || '');
    });

    idInput?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleId(idInput.value || '');
      }
    });

    createBtn?.addEventListener('click', () => {
      handleCreateNew();
    });

    const url = new URL(window.location.href);
    const initialId = url.searchParams.get('id') || '';
    if (initialId && idInput) {
      idInput.value = initialId;
    }

    if (initialId) {
      handleId(initialId);
    } else {
      setStatus('Waiting for an id. Provide a composite or prototype id, or create a new planner.');
    }
  </script>
</body>
</html>
