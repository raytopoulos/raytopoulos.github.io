<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bubble Canvas (Refactored)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" role="application" aria-label="Bubble canvas app">
    <aside id="sidebar" class="sidebar" aria-label="Bubble library">
      <header>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 7h10v10H7z" stroke="#38bdf8" stroke-width="1.5"/><path d="M12 4v16M4 12h16" stroke="#22d3ee" stroke-width="1.5"/></svg>
        Bubble Library
        <button id="closeSidebar" class="close-btn" aria-label="Close library" title="Close">&times;</button>
      </header>
      <div class="hint">Drag a bubble onto the canvas to create an instance.</div>

      <div id="templates" class="bubbles-list" aria-live="polite"></div>

      <button id="addBtn" class="add-btn" aria-label="Add bubble">+ Add bubble</button>
    </aside>

    <main>
      <div class="toolbar">
        <button id="menuBtn" class="menu-btn" aria-controls="sidebar" aria-expanded="false" aria-label="Open bubble library" title="Open library">&#9776;</button>
        <div>
          💡 Tip: Hold and drag bubbles on the canvas to reposition them. Create new kinds of bubbles with the + button.
        </div>
      </div>
      <div id="canvas" class="canvas" aria-label="Canvas" tabindex="0">
        <div class="week-table-wrapper" aria-hidden="true">
          <table class="week-table" role="presentation">
            <thead>
              <tr>
                <th>Mon</th>
                <th>Tue</th>
                <th>Wed</th>
                <th>Thu</th>
                <th>Fri</th>
                <th>Sat</th>
                <th>Sun</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td></td><td></td><td></td><td></td><td></td><td></td><td></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <div id="trash" class="trash-zone" aria-hidden="true" aria-label="Delete dropzone">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 6h18M9 6v-1a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14" stroke="#e5e7eb" stroke-width="1.5"/><path d="M10 10v8M14 10v8" stroke="#f87171" stroke-width="1.5"/></svg>
    <div class="label">Drop to delete</div>
  </div>

  <!-- New Bubble Modal -->
  <div id="modal" class="modal" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h2 id="dlg-title">Create a new bubble</h2>
      <form id="newBubbleForm">
        <div class="form-row">
          <label for="bubbleText">Bubble text</label>
          <input id="bubbleText" name="bubbleText" type="text" placeholder="e.g. Idea, Todo, Person…" required minlength="1" />
        </div>
        <div class="form-row">
          <label>Color</label>
          <div id="colorPresets" class="color-presets" role="group" aria-label="Choose a color"></div>
        </div>
        <div class="actions">
          <button type="button" class="btn" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn primary">OK</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
